"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$os\
$directory\
$git_branch\
$git_status\
$character"""

right_format = """
$package\
$rust\
$python\
$nodejs\
$ruby\
$golang\
$cmd_duration\
$time"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
staged = "+"
modified = "!"
renamed = "»"
deleted = "✘"

[package]
symbol = "📦 "
style = "bold 208"
format = "is [$symbol$version]($style)"

[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol$version]($style)"
detect_extensions = []
detect_files = ["Cargo.toml", ".rust-version"]

[python]
symbol = "🐍 "
style = "bold yellow"
format = 'via [${symbol}${version}]($style)'
detect_extensions = []
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", "setup.py", ".python-version", "tox.ini"]

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"
detect_extensions = []
detect_files = [".node-version", ".nvmrc"]

[ruby]
symbol = "💎 "
style = "bold red"
format = "via [$symbol($version )]($style)"
detect_extensions = []
detect_files = ["Gemfile", ".ruby-version"]

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"
detect_extensions = []
detect_files = ["go.mod", "go.sum", ".go-version"]

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style)"

[username]
style_user = "bold red"
style_root = "bold red"
format = "[$user]($style) in "
show_always = false

[time]
disabled = false
time_format = "%I:%M %p"
style = "bold dim white"
format = " [󰥔 $time]($style)"
